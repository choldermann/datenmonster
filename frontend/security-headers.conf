# Sicherheits-Header für die Oberfläche. Eigene Datei, weil nginx Header aus dem
# server-Block NICHT erbt, sobald ein location-Block selbst add_header setzt –
# deshalb in jedem solchen Block erneut einbinden.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Bewusst schmal: verbietet Einbetten durch fremde Seiten, Plugins/<object> und
# umgebogene Basis-URLs. Eine strenge script-src würde Inline-Teile des Bundles
# brechen und braucht einen eigenen Test im Browser.
add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
