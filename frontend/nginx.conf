server {
    listen 80;

    client_max_body_size 50M;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Sicherheits-Header nur für die Oberfläche; /api/ setzt das Backend selbst
    # (sonst doppelt und widersprüchlich, z. B. X-Frame-Options DENY + SAMEORIGIN).

    # API-Anfragen ans Backend weiterleiten (ersetzt den Vite-Dev-Proxy)
    location /api/ {
        # Name bei jeder Anfrage über das Docker-DNS auflösen (max. 10 s Cache).
        # Mit festem proxy_pass merkt sich nginx die IP vom eigenen Start – wird
        # das Backend neu erstellt (Update, Compose-Abgleich), bekommt es eine
        # neue IP und jede Anfrage endet in 502, bis jemand das Frontend neu
        # startet. Ohne URI-Teil reicht nginx den Pfad unverändert weiter.
        resolver           127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8000;
        proxy_pass         $backend_upstream;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;

        # SSE: kein Buffering, damit Tokens sofort beim Client ankommen
        proxy_buffering    off;
        proxy_cache        off;
    }

    # Gebaute Assets tragen einen Inhalts-Hash im Namen. Fehlt eine Datei, darf
    # NICHT auf index.html zurückgefallen werden: der Browser bekäme HTTP 200 mit
    # HTML, wo er ein JavaScript-Modul erwartet, könnte es nicht parsen und die
    # gesamte Seite bliebe leer. Genau das passiert nach jedem Update in einem
    # Tab, der noch die alte index.html im Cache hat. Ein ehrliches 404 lässt den
    # Browser stattdessen neu laden.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # index.html selbst nie cachen – sie ist der Verweis auf die aktuellen Assets.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
        expires 0;
    }

    # SPA: alle übrigen Routen auf index.html
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
